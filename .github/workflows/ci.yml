name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
          ANALYTICS_SALT: ci-placeholder-analytics-salt
          CRON_SECRET: ci-placeholder-cron

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simplecms
          POSTGRES_PASSWORD: simplecms
          POSTGRES_DB: simplecms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplecms -d simplecms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://simplecms:simplecms@localhost:5432/simplecms?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
      ANALYTICS_SALT: ci-placeholder-analytics-salt
      CRON_SECRET: ci-placeholder-cron
      SEED_ADMIN_EMAIL: admin@simplecms.local
      SEED_ADMIN_PASSWORD: Admin123!
      UPLOAD_DIR: ./data/uploads
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: PORT=3100 pnpm start &
      - run: npx wait-on http://localhost:3100/api/health
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100
