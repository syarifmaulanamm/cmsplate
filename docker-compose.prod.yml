services:
  db:
    image: postgres:16-alpine
    container_name: cmsplate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplecms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-simplecms}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplecms} -d ${POSTGRES_DB:-simplecms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    image: cmsplate:1.0.0
    container_name: cmsplate-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-simplecms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simplecms}?schema=public
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
      ADMIN_PATH: ${ADMIN_PATH:-admin}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  uploads:
